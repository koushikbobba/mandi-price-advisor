<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kisan AI — Mandi Price Advisor | Bobba Koushik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      :root {
        --font-display: 'Space Grotesk', sans-serif;
        --font-body: 'Inter', 'Noto Sans Telugu', 'Noto Sans Tamil', 'Noto Sans Devanagari', 'Noto Sans Kannada', sans-serif;
        --font-mono: 'JetBrains Mono', 'Courier New', monospace;
        --emerald: #10b981;
        --emerald-glow: rgba(16,185,129,0.25);
      }
      body { font-family: var(--font-body); letter-spacing: -0.01em; }
      h1,h2,h3,h4,h5,h6,.font-display { font-family: var(--font-display); }
      pre, code, .font-mono { font-family: var(--font-mono); }

      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(16,185,129,0.3); border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(16,185,129,0.55); }

      @keyframes pulse-glow {
        0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
        50%      { box-shadow: 0 0 22px 5px rgba(16,185,129,0.28); }
      }
      @keyframes shimmer {
        0%   { background-position: -200% center; }
        100% { background-position:  200% center; }
      }
      @keyframes float-in {
        from { opacity:0; transform: translateY(12px); }
        to   { opacity:1; transform: translateY(0); }
      }
      @keyframes spin-slow { to { transform: rotate(360deg); } }

      .ai-glow   { animation: pulse-glow 3s ease-in-out infinite; }
      .float-in  { animation: float-in .35s cubic-bezier(.16,1,.3,1) forwards; }
      .spin-slow { animation: spin-slow 8s linear infinite; }
      .shimmer-text {
        background: linear-gradient(90deg,#10b981 0%,#34d399 40%,#6ee7b7 60%,#10b981 100%);
        background-size: 200% auto;
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shimmer 3s linear infinite;
      }
      .glass {
        background: rgba(15,23,42,0.7);
        backdrop-filter: blur(16px) saturate(1.4);
        -webkit-backdrop-filter: blur(16px) saturate(1.4);
        border: 1px solid rgba(255,255,255,0.06);
      }
      .glass-light {
        background: rgba(30,41,59,0.65);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.07);
      }
      .gradient-border {
        position: relative;
      }
      .gradient-border::before {
        content: '';
        position: absolute; inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, rgba(16,185,129,0.5), rgba(99,102,241,0.2), rgba(16,185,129,0.1));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
        pointer-events: none;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased min-h-screen selection:bg-emerald-500/40 selection:text-emerald-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
